<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Features Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin: 10px 0 5px;
            color: #555;
        }
        input[type="text"], input[type="number"], select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="checkbox"] {
            margin-right: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .submit-button {
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>House Purchase Decision Model</h1>
    <p>Please select the house features you want to determine the best price available.</p>
    <form action="#" method="post">
        <label for="zipcode">Zipcode:</label>
        <select id="zipcode" name="zipcode" required>
            <option value="" disabled selected>Select Zipcode</option>
            {% for zipcode in zipcodes %}
                <option value="{{ zipcode }}">{{ zipcode }}</option>
            {% endfor %}
        </select>

        <label for="bathrooms">Bathrooms:</label>
        <input type="number" id="bathrooms" name="bathrooms" required>

        <label for="sqrt_ft">Square Footage (sq ft):</label>
        <input type="number" id="sqrt_ft" name="sqrt_ft" required>

        <label for="fireplaces">Fireplaces:</label>
        <input type="number" id="fireplaces" name="fireplaces" required>

        <label for="house_age">House Age (years):</label>
        <input type="number" id="house_age" name="house_age" required>

        <label>Appliances:</label>
        <div class="checkbox-group">
            <input type="checkbox" id="has_Dishwasher" name="has_Dishwasher">
            <label for="has_Dishwasher">Has Dishwasher</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="has_Oven" name="has_Oven">
            <label for="has_Oven">Has Oven</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="has_Refrigerator" name="has_Refrigerator">
            <label for="has_Refrigerator">Has Refrigerator</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="has_Freezer" name="has_Freezer">
            <label for="has_Freezer">Has Freezer</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="has_Microwave" name="has_Microwave">
            <label for="has_Microwave">Has Microwave</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="has_Countertops" name="has_Countertops">
            <label for="has_Countertops">Has Countertops</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="has_Pantry" name="has_Pantry">
            <label for="has_Pantry">Has Pantry</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="has_Others_appliances" name="has_Others_appliances">
            <label for="has_Others_appliances">Has Other Appliances</label>
        </div>

        <button type="submit" class="submit-button">Submit</button>
    </form>
</div>

</body>
</html>
